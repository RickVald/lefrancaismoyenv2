<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page introuvable — Le Français Moyen</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/styles.css?v=11">
  <style>
    .err-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
    .err-code{font-size:clamp(5rem,20vw,10rem);font-weight:900;letter-spacing:-.08em;color:var(--accent);opacity:.25;line-height:1;margin-bottom:-16px}
    .err-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;margin:0 0 12px;letter-spacing:-.04em}
    .err-sub{color:var(--muted);max-width:460px;margin:0 auto 32px;font-size:1rem;line-height:1.6}
    .err-links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="/" class="brand"><div class="logo">LF</div>Le Français Moyen</a>
    </div>
  </header>

  <main class="err-wrap">
    <div class="err-code">404</div>
    <h1 class="err-title">Cette page n'existe pas</h1>
    <p class="err-sub">Le lien est peut-être cassé, ou la page a été déplacée. Retrouvez toutes les données sur le tableau de bord.</p>
    <div class="err-links">
      <a href="/" class="button">← Tableau de bord</a>
      <a href="/outils/" class="button secondary">Boîte à outils</a>
      <a href="/questions/" class="button secondary">Questions</a>
    </div>
  </main>

  <footer>
    <span>© 2026 Le Français Moyen — Données : INSEE, Banque de France, Eurostat</span>
  </footer>
</body>
</html>
