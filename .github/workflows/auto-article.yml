name: Auto-article Le Français Moyen

on:
  schedule:
    # Mardi 8h07 UTC (10h07 heure Paris)
    - cron: '7 8 * * 2'
    # Vendredi 8h11 UTC (10h11 heure Paris)
    - cron: '11 8 * * 5'
  # Permet de déclencher manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  publish-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Générer l'article via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/auto-article.js

      - name: Vérifier s'il y a des changements
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et push l'article
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Le Français Moyen Bot"
          git config user.email "bot@le-francais-moyen.com"
          # Lire les infos du fichier généré par le script
          INFO=$(cat _auto_article_info.txt 2>/dev/null || echo "$(date +%Y-%m-%d)|article|Nouvel article|sources officielles")
          DATE=$(echo $INFO | cut -d'|' -f1)
          SLUG=$(echo $INFO | cut -d'|' -f2)
          TITRE=$(echo $INFO | cut -d'|' -f3)
          SOURCE=$(echo $INFO | cut -d'|' -f4)
          rm -f _auto_article_info.txt
          git add questions/${SLUG}.html questions/index.html sitemap.xml assets/img/og/${SLUG}.png || true
          git add -u
          git commit -m "Auto-article ${DATE} : ${TITRE}

Article publié automatiquement depuis l'actualité économique française.
Source principale : ${SOURCE}

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git pull --rebase origin main
          git push origin main

      - name: Aucun article publié (pas de sujet pertinent)
        if: steps.changes.outputs.changed == 'false'
        run: echo "Aucun sujet pertinent trouvé aujourd'hui — pas de publication."
