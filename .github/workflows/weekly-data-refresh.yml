name: weekly-data-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday 07:00 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch latest official data
        env:
          INSEE_TOKEN: ${{ secrets.INSEE_TOKEN }}
        run: node scripts/build-data.js

      - name: Commit and push refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-series.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: weekly data refresh $(date +%Y-%m-%d)"
          git push
